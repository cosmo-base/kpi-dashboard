# .github/workflows/nextjs.yml
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci --legacy-peer-deps" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
            
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        
      # CSV の URL は画面に埋め込まず、GAS に送る（GAS がログインした人にだけ CSV を返す）
      - name: Send CSV sources to GAS
        run: node scripts/sync-sources.mjs
        env:
          KPI_GAS_URL: ${{ vars.KPI_GAS_URL }}
          KPI_SYNC_KEY: ${{ secrets.KPI_SYNC_KEY }}
          NEXT_PUBLIC_KPI_SNS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_SNS_CSV_URL }}
          NEXT_PUBLIC_KPI_QUIZ_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_QUIZ_CSV_URL }}
          NEXT_PUBLIC_KPI_TYPE1_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_TYPE1_CSV_URL }}
          NEXT_PUBLIC_KPI_TYPE2_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_TYPE2_CSV_URL }}
          NEXT_PUBLIC_KPI_TYPE3_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_TYPE3_CSV_URL }}
          NEXT_PUBLIC_KPI_ROCKETS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ROCKETS_CSV_URL }}
          NEXT_PUBLIC_KPI_CONSTELLATION_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CONSTELLATION_CSV_URL }}
          NEXT_PUBLIC_KPI_CBL_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBL_CSV_URL }}
          NEXT_PUBLIC_KPI_CBMD_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBMD_CSV_URL }}
          NEXT_PUBLIC_KPI_CBHP_TREND_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBHP_TREND_CSV_URL }}
          NEXT_PUBLIC_KPI_CBHP_SOURCE_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBHP_SOURCE_CSV_URL }}
          NEXT_PUBLIC_KPI_CBHP_PAGES_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBHP_PAGES_CSV_URL }}
          NEXT_PUBLIC_KPI_CBHP_REGION_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBHP_REGION_CSV_URL }}
          NEXT_PUBLIC_KPI_CBHP_CONVERSIONS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBHP_CONVERSIONS_CSV_URL }}
          NEXT_PUBLIC_KPI_CBHP_DEMOGRAPHICS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBHP_DEMOGRAPHICS_CSV_URL }}
          NEXT_PUBLIC_KPI_AUTOMATION_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_AUTOMATION_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTICIPANTS_TREND_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTICIPANTS_TREND_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTICIPANTS_SOURCE_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTICIPANTS_SOURCE_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTICIPANTS_PAGES_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTICIPANTS_PAGES_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTICIPANTS_REGION_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTICIPANTS_REGION_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTICIPANTS_CONVERSIONS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTICIPANTS_CONVERSIONS_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTICIPANTS_DEMOGRAPHICS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTICIPANTS_DEMOGRAPHICS_CSV_URL }}
          NEXT_PUBLIC_KPI_CBED_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_CBED_CSV_URL }}
          NEXT_PUBLIC_KPI_PARTNER_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_PARTNER_CSV_URL }}
          NEXT_PUBLIC_KPI_SHITTOKU_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_SHITTOKU_CSV_URL }}
          NEXT_PUBLIC_KPI_LINKS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_LINKS_CSV_URL }}
          NEXT_PUBLIC_KPI_SPACECRAFT_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_SPACECRAFT_CSV_URL }}
          NEXT_PUBLIC_KPI_SPACECRAFT_PROGRESS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_SPACECRAFT_PROGRESS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_DAILY_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_DAILY_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_TESTS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_TESTS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_SCORE_DIST_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_SCORE_DIST_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_PRACTICE_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_PRACTICE_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_SEGMENTS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_SEGMENTS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_QUESTIONS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_QUESTIONS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_PROMOTION_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_PROMOTION_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_RETENTION_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_RETENTION_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_HEATMAP_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_HEATMAP_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_REPORTS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_REPORTS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_ERRORS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_ERRORS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_LEVELS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_LEVELS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_OPS_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_OPS_CSV_URL }}
          NEXT_PUBLIC_KPI_ARCHIVE_META_CSV_URL: ${{ secrets.NEXT_PUBLIC_KPI_ARCHIVE_META_CSV_URL }}

      - name: Check settings
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::error::リポジトリの Variables に GOOGLE_CLIENT_ID（FSIF Portal と同じ Google ログインのクライアントID）を設定してください"
            exit 1
          fi

      # 画面に埋め込むのは GAS の URL と Google ログインのクライアントID だけ（どちらも秘密ではない）
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          NEXT_PUBLIC_KPI_GAS_URL: ${{ vars.KPI_GAS_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "First deploy attempt failed, retrying in 30 seconds..."
          sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
